general {
    lock_cmd = lock-screen
    before_sleep_cmd = lock-screen
    after_sleep_cmd = sleep 1 && wake-screen
    inhibit_sleep = 3
}

# Screensaver after 25 minutes
listener {
    timeout = 1500
    on-timeout = pidof hyprlock || launch-screensaver
}

# Lock after 25 min 10 sec
listener {
    timeout = 1510
    on-timeout = lock-screen
    on-resume = wake-screen
}

# Keyboard backlight off after 55 minutes
listener {
    timeout = 3300
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# Screen off after 55 minutes
listener {
    timeout = 3300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}
